<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>GlobalExam Auto</h1>
    </header>

    <button id="toggle" class="main">▶ Démarrer</button>

    <p class="status" id="status">Arrêté</p>

    <div class="stats">
      <div><strong id="answers">0</strong><span>réponses</span></div>
      <div><strong id="correct">0</strong><span>justes</span></div>
      <div><strong id="exos">0</strong><span>exercices</span></div>
    </div>

    <div class="field">
      <label for="correctRate">Bonnes réponses</label>
      <div class="input"><input type="number" id="correctRate" min="0" max="100" step="5" /><span>%</span></div>
    </div>

    <div class="field">
      <label for="pageDelay">Attente par page</label>
      <div class="input"><input type="number" id="pageDelay" min="1" step="5" /><span>s</span></div>
    </div>

    <div class="field">
      <label for="pageJitter">Variation aléatoire</label>
      <div class="input"><span>±</span><input type="number" id="pageJitter" min="0" step="5" /><span>s</span></div>
    </div>

    <div class="field">
      <label for="runFor">Durée de session</label>
      <div class="input"><input type="time" id="runFor" step="60" /></div>
    </div>

    <p class="warn" id="warnRun" hidden>Plus de 5 h par jour se voit sur votre page Statistiques.</p>

    <label class="check"><input type="checkbox" id="chain" /> Enchaîner les exercices</label>
    <label class="check"><input type="checkbox" id="showHud" /> Panneau flottant sur la page</label>

    <button id="dash" class="ghost">Tableau de bord</button>

    <p class="hint" id="hint"></p>

    <script src="popup.js"></script>
  </body>
</html>
